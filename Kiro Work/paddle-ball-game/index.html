<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paddle Ball Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141418;
      color: #E7E3F4;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      background: #1E1E24; /* dark grey (Requirement 3.3) */
      border: 1px solid #3a3a44;
      border-radius: 6px;
      display: block;
    }
    .hint {
      font-size: 13px;
      color: #8f8aa3;
    }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="300"></canvas>
  <div class="hint">Use ↑ / ↓ arrow keys to move the right paddle. Reach the ball before the computer does.</div>

  <script type="module">
    import { CONFIG, createState, update } from './game.js';

    const canvas = document.getElementById('game');
    // Error handling: check canvas exists.
    if (!canvas) throw new Error('Canvas element not found');
    const ctx = canvas.getContext('2d');

    const state = createState(CONFIG);

    // --- Input handling (Requirements 1.1, 1.2) ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { state.input.up = true; e.preventDefault(); }
      if (e.key === 'ArrowDown') { state.input.down = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') { state.input.up = false; e.preventDefault(); }
      if (e.key === 'ArrowDown') { state.input.down = false; e.preventDefault(); }
    });

    // --- Drawing (Requirements 3.1, 3.2, 3.3) ---
    function draw() {
      // Clear with background.
      ctx.fillStyle = CONFIG.backgroundColor;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // Center dashed line.
      ctx.strokeStyle = '#39343f';
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(CONFIG.width / 2, 0);
      ctx.lineTo(CONFIG.width / 2, CONFIG.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles (black rectangles).
      ctx.fillStyle = CONFIG.paddleColor;
      const leftX = CONFIG.paddleMargin;
      const rightX = CONFIG.width - CONFIG.paddleMargin - CONFIG.paddleWidth;
      ctx.fillRect(leftX, state.leftY, CONFIG.paddleWidth, CONFIG.paddleHeight);
      ctx.fillRect(rightX, state.rightY, CONFIG.paddleWidth, CONFIG.paddleHeight);

      // Ball (purple circle).
      ctx.fillStyle = CONFIG.ballColor;
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, CONFIG.ballRadius, 0, Math.PI * 2);
      ctx.fill();

      // Scoreboard: simple, top-center.
      ctx.fillStyle = CONFIG.textColor;
      ctx.font = '16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(
        `Player: ${state.score.player}  |  Computer: ${state.score.computer}`,
        CONFIG.width / 2,
        24
      );
    }

    // --- Game loop (Requirement 3.4): 60 FPS via setInterval ---
    function tick() {
      update(state, CONFIG);
      draw();
    }
    draw();
    setInterval(tick, 16);
  </script>
</body>
</html>
